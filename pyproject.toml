[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corestorm-combinations"
version = "1.0.0"
description = "Fast, resumable fixed-width decimal combination generator"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "CoreStorm contributors"}]
dependencies = []

[project.optional-dependencies]
gpu = ["numpy", "numba"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
corestorm-combinations = "generateCombinations:main"

[tool.setuptools]
py-modules = ["generateCombinations"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

